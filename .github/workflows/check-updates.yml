name: Check WordPress & NPM Updates (reusable)

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: arc-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.6

      - name: Haal update-informatie op via SSH
        id: get_updates
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.KINSTA_SERVER_IP }}
          username: ${{ secrets.KINSTA_USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          capture_stdout: true
          envs: KINSTA_SITE_PATH
          script: |
            cd "$KINSTA_SITE_PATH"
            wp transient delete update_plugins 2>/dev/null || true
            wp transient delete update_themes 2>/dev/null || true
            wp transient delete update_core 2>/dev/null || true
            echo "=== WORDPRESS CORE ==="
            wp core check-update 2>/dev/null || true
            echo "=== PLUGINS ==="
            wp plugin list --update=available --fields=name,version,update_version 2>/dev/null || true
            echo "=== THEMES ==="
            wp theme list --update=available --fields=name,version,update_version 2>/dev/null || true
        env:
          KINSTA_SITE_PATH: ${{ secrets.KINSTA_SITE_PATH }}

      - name: Controleer of er WordPress updates zijn
        id: check_updates
        shell: bash
        env:
          SSH_STDOUT: ${{ steps.get_updates.outputs.stdout }}
        run: |
          printf '%s' "$SSH_STDOUT" > /tmp/update_output.txt
          if grep -qiE "(update_version|update available)" /tmp/update_output.txt; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "WordPress updates gevonden!"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Geen WordPress updates."
          fi

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@64ed1c7eab4cce3362f8c340dee64e5eaeef8f7c
        with:
          node-version: lts/*

      - name: Controleer NPM updates (minor + patch)
        id: check_npm
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          # Snapshot huidige versies (dep + devDep) vóór enige wijziging.
          node -e "const p=require('./package.json');console.log(JSON.stringify({...(p.dependencies||{}),...(p.devDependencies||{})}))" > /tmp/npm-current.json
          # Read-only passes: welke minor/patch en welke latest (voor majors).
          npx --yes npm-check-updates@latest --jsonUpgraded --target minor > /tmp/npm-minor.json || echo '{}' > /tmp/npm-minor.json
          npx --yes npm-check-updates@latest --jsonUpgraded > /tmp/npm-latest.json || echo '{}' > /tmp/npm-latest.json
          # Pas alleen minor/patch daadwerkelijk toe.
          # Let op: geen "--color false" — ncu leest het losse woord "false"
          # als package-filter en vindt dan nooit iets ("No dependencies").
          npx --yes npm-check-updates@latest -u --target minor
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package.json package-lock.json; then
            echo "has_npm_updates=false" >> "$GITHUB_OUTPUT"
            echo "Geen NPM updates."
          else
            echo "has_npm_updates=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- package.json package-lock.json
          fi

      - name: Maak update branch en PR aan
        if: steps.check_updates.outputs.has_updates == 'true' || steps.check_npm.outputs.has_npm_updates == 'true'
        uses: actions/github-script@v7
        env:
          UPDATE_OUTPUT: ${{ steps.get_updates.outputs.stdout }}
          HAS_WP: ${{ steps.check_updates.outputs.has_updates }}
          HAS_NPM: ${{ steps.check_npm.outputs.has_npm_updates }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            // === BEGIN manifest helpers ===
            // Embedded copy van scripts/updates/manifest.js (de workspace bevat
            // de klant-repo, dus require() kan niet). Houd synchroon — de
            // drift-test in scripts/updates/manifest.test.js bewaakt dit.
            function sections(stdout) {
              const out = {}
              let current = null
              for (const rawLine of String(stdout).split('\n')) {
                const line = rawLine.replace(/\r$/, '')
                const header = line.match(/^===\s*(.+?)\s*===$/)
                if (header) {
                  const name = header[1].toUpperCase()
                  // Ignore the trailing separator line (=====...) which has empty name.
                  if (name && !/^=+$/.test(name)) {
                    current = name
                    out[current] = []
                  } else {
                    current = null
                  }
                  continue
                }
                if (current) out[current].push(line)
              }
              return out
            }
            function dataRows(lines, headerFirstCol) {
              return (lines || [])
                .filter((l) => l.includes('\t'))
                .map((l) => l.split('\t'))
                .filter((cols) => cols[0] && cols[0] !== headerFirstCol)
            }
            function parseWpUpdates(stdout) {
              const s = sections(stdout)
              const core = dataRows(s['WORDPRESS CORE'], 'version').map((c) => ({
                version: c[0],
                updateType: c[1] || '',
              }))
              const toPkg = (rows) => rows.map((c) => ({ name: c[0], from: c[1] || '', to: c[2] || '' }))
              return {
                core,
                plugins: toPkg(dataRows(s['PLUGINS'], 'name')),
                themes: toPkg(dataRows(s['THEMES'], 'name')),
              }
            }
            function parseSemver(v) {
              const m = String(v).replace(/^[^\d]*/, '').match(/^(\d+)\.(\d+)\.(\d+)/)
              if (!m) return null
              return { major: +m[1], minor: +m[2], patch: +m[3] }
            }
            function classifyBump(from, to) {
              const a = parseSemver(from)
              const b = parseSemver(to)
              if (!a || !b) return 'minor'
              if (b.major !== a.major) return 'major'
              if (b.minor !== a.minor) return 'minor'
              return 'patch'
            }
            function computeNpmUpdates({ current = {}, minor = {}, latest = {} }) {
              const applied = Object.keys(minor).map((name) => ({
                name,
                from: current[name] ?? '',
                to: minor[name],
                type: classifyBump(current[name] ?? '', minor[name]),
              }))
              const availableMajors = Object.keys(latest)
                .filter((name) => classifyBump(current[name] ?? '', latest[name]) === 'major')
                .map((name) => ({ name, from: current[name] ?? '', to: latest[name] }))
              return { applied, availableMajors }
            }
            function buildManifest({ generatedAt, wordpress, npm }) {
              return {
                generatedAt,
                wordpress: {
                  core: wordpress.core || [],
                  plugins: wordpress.plugins || [],
                  themes: wordpress.themes || [],
                },
                npm: {
                  applied: (npm && npm.applied) || [],
                  availableMajors: (npm && npm.availableMajors) || [],
                },
              }
            }
            function renderNpmMajorsSection(availableMajors) {
              if (!availableMajors || availableMajors.length === 0) return ''
              const lines = availableMajors.map((m) => `- \`${m.name}\` ${m.from} → ${m.to}`).join('\n')
              return [
                '### ⚠️ Beschikbare major updates — NIET automatisch uitgevoerd (meerwerk)',
                '',
                'Deze npm-majors zijn beschikbaar maar bewust niet toegepast. Handmatig oppakken indien gewenst.',
                '',
                lines,
                '',
              ].join('\n')
            }
            // === EINDE manifest helpers ===
            const date = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            const branch = `automated/updates-${date}`;
            const updateOutput = process.env.UPDATE_OUTPUT || 'Geen update informatie beschikbaar';
            const hasWp = process.env.HAS_WP === 'true';
            const hasNpm = process.env.HAS_NPM === 'true';
            const defaultBranch = context.payload.repository.default_branch;

            // Build the structured manifest that both this PR body and the
            // desktop tool read from.
            const readJson = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return {}; } };
            const wordpress = hasWp ? parseWpUpdates(updateOutput) : { core: [], plugins: [], themes: [] };
            const npm = hasNpm
              ? computeNpmUpdates({
                  current: readJson('/tmp/npm-current.json'),
                  minor: readJson('/tmp/npm-minor.json'),
                  latest: readJson('/tmp/npm-latest.json'),
                })
              : { applied: [], availableMajors: [] };
            const manifest = buildManifest({ generatedAt: new Date().toISOString(), wordpress, npm });

            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${defaultBranch}`
            });
            const sha = ref.object.sha;

            const { data: commit } = await github.rest.git.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha
            });

            const tree = [];

            if (hasWp) {
              const { data: blob } = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: `WordPress update check uitgevoerd op: ${date}\n\n${updateOutput}\n\nMerge deze PR om WP-CLI updates uit te voeren op de server.\n`,
                encoding: 'utf-8'
              });
              tree.push({ path: '.wp-update-log', mode: '100644', type: 'blob', sha: blob.sha });
            }

            if (hasNpm) {
              for (const file of ['package.json', 'package-lock.json']) {
                const content = fs.readFileSync(file, 'utf8');
                const { data: blob } = await github.rest.git.createBlob({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  content,
                  encoding: 'utf-8'
                });
                tree.push({ path: file, mode: '100644', type: 'blob', sha: blob.sha });
              }
            }

            // Structured manifest — single source of truth for PR + tool.
            {
              const { data: blob } = await github.rest.git.createBlob({
                owner: context.repo.owner,
                repo: context.repo.repo,
                content: JSON.stringify(manifest, null, 2) + '\n',
                encoding: 'utf-8'
              });
              tree.push({ path: '.updates.json', mode: '100644', type: 'blob', sha: blob.sha });
            }

            const { data: newTree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base_tree: commit.tree.sha,
              tree
            });

            const commitMessage = hasWp && hasNpm
              ? `chore: WordPress + NPM updates ${date}`
              : hasWp
                ? `chore: WordPress update check ${date}`
                : `chore: NPM minor/patch updates ${date}`;

            const { data: newCommit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: commitMessage,
              tree: newTree.sha,
              parents: [sha]
            });

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branch}`,
              sha: newCommit.sha
            });

            let body = `## Automatische update check\n\nGegenereerd op ${date}.\n\n`;
            if (hasWp) {
              body += `### WordPress updates\n\nMerge deze PR om de updates uit te voeren via de deploy workflow.\n\n\`\`\`\n${updateOutput}\n\`\`\`\n\n`;
            }
            if (hasNpm) {
              const appliedLines = manifest.npm.applied
                .map((u) => `- \`${u.name}\` ${u.from} → ${u.to} (${u.type})`)
                .join('\n');
              body += `### NPM updates (minor + patch)\n\n\`package.json\` en \`package-lock.json\` zijn bijgewerkt — bekijk de diff in deze PR.\n\n${appliedLines}\n\n`;
            }
            body += renderNpmMajorsSection(manifest.npm.availableMajors);

            const title = hasWp && hasNpm
              ? `Updates - ${date}`
              : hasWp
                ? `WordPress Updates - ${date}`
                : `NPM Updates - ${date}`;

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: branch,
              base: defaultBranch,
              body
            });

            // Ruim oude update branches op (behalve de zojuist aangemaakte)
            const oldPrefixes = ['automated/updates-', 'automated/wp-updates-'];
            const { data: allRefs } = await github.rest.git.listMatchingRefs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/automated/'
            });

            for (const ref of allRefs) {
              const name = ref.ref.replace('refs/heads/', '');
              if (name === branch) continue;
              if (!oldPrefixes.some(p => name.startsWith(p))) continue;

              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${name}`,
                state: 'open'
              });
              for (const pr of prs) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  state: 'closed'
                });
                console.log(`PR #${pr.number} gesloten voor branch ${name}`);
              }

              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${name}`
                });
                console.log(`Branch ${name} verwijderd`);
              } catch (e) {
                console.log(`Kon branch ${name} niet verwijderen: ${e.message}`);
              }
            }

  security-scan:
    runs-on: arc-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.6

      - name: PHP security audit (composer)
        id: composer_audit
        if: hashFiles('composer.lock') != ''
        shell: bash
        run: |
          set +e
          composer audit --format=json --no-interaction > composer-audit.json 2>&1
          COMPOSER_EXIT=$?
          set -e

          TOTAL=0
          if command -v jq &>/dev/null && [ -f composer-audit.json ]; then
            TOTAL=$(jq '[.advisories | to_entries[].value | length] | add // 0' composer-audit.json 2>/dev/null || echo 0)
          fi

          echo "issues=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Composer audit afgerond — $TOTAL kwetsbaarhed(en) gevonden"

      - name: Setup Node
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@64ed1c7eab4cce3362f8c340dee64e5eaeef8f7c
        with:
          node-version: lts/*

      - name: NPM security audit
        id: npm_audit
        if: hashFiles('package-lock.json') != ''
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json 2>&1
          set -e

          TOTAL=0
          if command -v jq &>/dev/null && [ -f npm-audit.json ]; then
            TOTAL=$(jq '.metadata.vulnerabilities.total // 0' npm-audit.json 2>/dev/null || echo 0)
          fi

          echo "vulnerabilities=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "NPM audit afgerond — $TOTAL kwetsbaarhed(en) gevonden"

      - name: Security samenvatting
        if: always()
        shell: bash
        env:
          COMPOSER_ISSUES: ${{ steps.composer_audit.outputs.issues || '0' }}
          NPM_VULNS: ${{ steps.npm_audit.outputs.vulnerabilities || '0' }}
        run: |
          {
            echo "## Security Scan (OWASP A06 — Vulnerable Components)"
            echo ""

            if [ -f composer-audit.json ]; then
              if [ "$COMPOSER_ISSUES" = "0" ]; then
                echo "### PHP (composer) ✅ Geen bekende kwetsbaarheden"
              else
                echo "### PHP (composer) ⚠️ ${COMPOSER_ISSUES} kwetsbaarhed(en) gevonden"
                echo '```'
                jq -r '.advisories | to_entries[] | .key + ": " + (.value[] | .title + " [" + .cve + "] — " + .link)' composer-audit.json 2>/dev/null || cat composer-audit.json
                echo '```'
              fi
            else
              echo "### PHP (composer) — geen composer.lock aanwezig"
            fi

            echo ""

            if [ -f npm-audit.json ]; then
              if [ "$NPM_VULNS" = "0" ]; then
                echo "### NPM ✅ Geen bekende kwetsbaarheden"
              else
                echo "### NPM ⚠️ ${NPM_VULNS} kwetsbaarhed(en) gevonden"
                echo '```'
                jq -r '.vulnerabilities | to_entries[] | select(.value.severity == "high" or .value.severity == "critical") | .key + " (" + .value.severity + "): " + (.value.via[] | if type == "object" then .title else . end)' npm-audit.json 2>/dev/null || true
                echo '```'
              fi
            else
              echo "### NPM — geen package-lock.json aanwezig"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit rapporten
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_id }}
          path: |
            composer-audit.json
            npm-audit.json
          if-no-files-found: ignore
          retention-days: 30
