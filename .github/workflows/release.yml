name: Release macOS App

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Genereer de changelog
        id: changelog
        run: |
          chmod +x .github/scripts/changelog.sh
          .github/scripts/changelog.sh "${{ github.ref_name }}" > /tmp/changelog.md
          echo "--- changelog ---"
          cat /tmp/changelog.md

      - name: Stempel de versie in Info.plist
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" build/darwin/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" build/darwin/Info.plist
          plutil -p build/darwin/Info.plist | grep -i version

      - name: Build and package app
        run: task package
        env:
          CGO_ENABLED: 1
          APP_VERSION: ${{ github.ref_name }}

      - name: Zip app
        run: |
          cd bin
          APP=$(find . -name "*.app" -maxdepth 1 | head -1)
          zip -r --symlinks "RDM-Sites-Tool-${{ github.ref_name }}-macOS.zip" "$APP"

      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const zipName = `RDM-Sites-Tool-${tag}-macOS.zip`;
            const zipPath = path.join('bin', zipName);

            // De app leest deze sectie uit de release-body en toont hem in de
            // update-popup en het "wat is er nieuw"-venster. Ontbreekt hij
            // (geen commits, of het script faalde), dan valt de app terug op
            // "geen details beschikbaar".
            let changelog = '';
            try {
              changelog = fs.readFileSync('/tmp/changelog.md', 'utf8').trim();
            } catch (e) {
              core.warning(`geen changelog gevonden: ${e.message}`);
            }

            const installatie = `## Installatie

            1. Download \`${zipName}\`
            2. Pak uit en sleep naar je Applications map
            3. Eerste keer openen via Terminal:
               \`xattr -d com.apple.quarantine "/Applications/rdm-sites-tool.app"\`
               Daarna opent de app gewoon met dubbelklik.
            4. Download eenmalig de browser voor Playwright (nodig voor de PDF-export, de tests en de mediascan; vereist Node 20+):

               \`\`\`
               cd "/Applications/rdm-sites-tool.app/Contents/Resources/sidecar" && node node_modules/playwright/cli.js install chromium
               \`\`\`

               Dit hoort bij deze app-versie: gebruik dit commando en niet \`npx playwright install\`, want dat haalt een andere browserversie op dan de app verwacht.

            ## Configuratie

            Stel in via het ⚙ icoon in de app:
            - **Projects folder(s)** — map met al je lokale projecten
            - **Kinsta API key + Company ID** — voor de Kinsta tab

            ## Eenmalig bij deze versie

            De app-identiteit is gewijzigd van \`com.example.rdmsitestool\` naar
            \`nl.nobears.kinsta-updater\`. Daardoor vraagt macOS één keer opnieuw
            toegang tot je projectenmap. Je API-keys worden bij de eerste start
            automatisch overgezet; je hoeft niets opnieuw in te vullen.

            De oude keychain-items blijven staan onder de service
            \`nl.micromanage.rdm-sites-tool\`. Wil je die opruimen: open Keychain
            Access, zoek op die naam en verwijder de gevonden items.

            Vanaf deze versie controleert de app zelf op updates: bij het
            opstarten en daarna elke 6 uur. Je kunt dat uitzetten bij
            Instellingen → App-updates.`;

            const body = changelog ? `${changelog}\n\n${installatie}` : installatie;

            // Reuse the release when it already exists (e.g. created via the
            // GitHub UI together with the tag, or a re-run of this workflow).
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: `RDM Sites Tool ${tag}`,
                body,
                draft: false,
                prerelease: false,
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `RDM Sites Tool ${tag}`,
                body,
                draft: false,
                prerelease: false,
              });
            }

            // Replace an existing asset with the same name (re-runs).
            for (const asset of release.data.assets ?? []) {
              if (asset.name === zipName) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }

            const data = fs.readFileSync(zipPath);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: zipName,
              data,
            });
