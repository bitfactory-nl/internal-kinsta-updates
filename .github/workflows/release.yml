name: Release macOS App

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Build and package app
        run: task package
        env:
          CGO_ENABLED: 1

      - name: Zip app
        run: |
          cd bin
          APP=$(find . -name "*.app" -maxdepth 1 | head -1)
          zip -r --symlinks "RDM-Sites-Tool-${{ github.ref_name }}-macOS.zip" "$APP"

      - name: Create GitHub release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = context.ref.replace('refs/tags/', '');
            const zipName = `RDM-Sites-Tool-${tag}-macOS.zip`;
            const zipPath = path.join('bin', zipName);

            const body = `## Installatie

            1. Download \`${zipName}\`
            2. Pak uit en sleep naar je Applications map
            3. Eerste keer openen via Terminal:
               \`xattr -d com.apple.quarantine "/Applications/rdm-sites-tool.app"\`
               Daarna opent de app gewoon met dubbelklik.
            4. Download eenmalig de browser voor Playwright (nodig voor de PDF-export, de tests en de mediascan; vereist Node 20+):

               \`\`\`
               cd "/Applications/rdm-sites-tool.app/Contents/Resources/sidecar" && node node_modules/playwright/cli.js install chromium
               \`\`\`

               Dit hoort bij deze app-versie: gebruik dit commando en niet \`npx playwright install\`, want dat haalt een andere browserversie op dan de app verwacht.

            ## Configuratie

            Stel in via het ⚙ icoon in de app:
            - **Projects folder(s)** — map met al je lokale projecten
            - **Kinsta API key + Company ID** — voor de Kinsta tab`;

            // Reuse the release when it already exists (e.g. created via the
            // GitHub UI together with the tag, or a re-run of this workflow).
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: `RDM Sites Tool ${tag}`,
                body,
                draft: false,
                prerelease: false,
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `RDM Sites Tool ${tag}`,
                body,
                draft: false,
                prerelease: false,
              });
            }

            // Replace an existing asset with the same name (re-runs).
            for (const asset of release.data.assets ?? []) {
              if (asset.name === zipName) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id,
                });
              }
            }

            const data = fs.readFileSync(zipPath);
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: zipName,
              data,
            });
